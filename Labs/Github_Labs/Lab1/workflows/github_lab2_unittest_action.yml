name: Python Unittests

on:
  push:
    branches:
      - main

  # added pull_request trigger so tests also run on PRs to main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # changed from v2 to v4

    - name: Set up Python
      uses: actions/setup-python@v5  # changed from v2 to v5
      with:
        python-version: "3.11"  # upgraded to 3.11. 3.8 is end-of-life
        cache: pip  # caches pip packages for faster installs

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run unittests
      run: python -m unittest test.test_unittest

    - name: Notify on success
      if: success()
      run: echo "Unit tests passed successfully"

    - name: Notify on failure
      if: failure()
      run: echo "Unit tests failed"