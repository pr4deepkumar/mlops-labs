name: Model Retraining on Push to Main - Github Lab 2
run-name: Model Retraining on Push to Main - Github Lab 2

on:
  push:
    branches:
      - main  # Trigger the workflow on pushes to the main branch
    paths:
      - 'Labs/Github_Labs/Lab2/**'  # Only when Lab2 files change
  workflow_dispatch:

concurrency:
  group: github-lab2-model-retraining  # Shared with the scheduled workflow so only one run pushes at a time
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Labs/Github_Labs/Lab2  # run commands from the Lab2 folder

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: Labs/Github_Labs/Lab2/requirements.txt

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Generate and Store Timestamp
      id: timestamp
      run: |
        timestamp=$(date '+%Y%m%d%H%M%S')
        echo "$timestamp" > timestamp.txt
        echo "timestamp=$timestamp" >> $GITHUB_ENV

    - name: Retrain Model
      run: |
        python src/train_model.py --timestamp "$timestamp"

    - name: Evaluate Model and Log Metrics
      run: |
        python src/evaluate_model.py --timestamp "$timestamp"
        metrics_filename="${timestamp}_metrics.json"
        mkdir -p metrics
        mv "$metrics_filename" "metrics/$metrics_filename"

    - name: Store and Version the New Model
      run: |
        model_filename="model_${timestamp}_dt_model.joblib"
        mkdir -p models
        mv "$model_filename" "models/$model_filename"

    - name: Upload Model and Metrics
      uses: actions/upload-artifact@v4
      with:
        name: lab2-model-${{ env.timestamp }}
        path: |  # working-directory doesn't apply to "with:" paths
          Labs/Github_Labs/Lab2/models/model_${{ env.timestamp }}_dt_model.joblib
          Labs/Github_Labs/Lab2/metrics/${{ env.timestamp }}_metrics.json

    - name: Commit and Push Changes
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        metrics_filename="metrics/${timestamp}_metrics.json"
        model_filename="models/model_${timestamp}_dt_model.joblib"
        git add -f "$metrics_filename" "$model_filename"
        # Commit only if there are changes
        if ! git diff --cached --quiet; then
          git commit -m "Add metrics and updated model for $timestamp"
          git push
        else
          echo "No changes to commit."
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
